<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Test</title>
</head>
<body>
    <h1>Supabase API Test</h1>
    <div>
        <h2>Authentication</h2>
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <button id="signInButton">Sign In</button>
    </div>
    <div>
        <h2>API Test</h2>
        <button id="testButton" disabled>Test Supabase API</button>
    </div>
    <pre id="result"></pre>

    <script>
        const supabaseUrl = 'https://xggfntnpabhuijtdingq.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhnZ2ZudG5wYWJodWlqdGRpbmdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM0Njk4MjIsImV4cCI6MjA1OTA0NTgyMn0.Fis701SsfegDQjbt6ldBY95lnmsbvFrTfinjin7HUnc';
        let accessToken = null;

        // Sign In Button
        document.getElementById('signInButton').addEventListener('click', async () => {
            const resultElement = document.getElementById('result');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                resultElement.textContent = 'Please enter email and password';
                return;
            }
            
            resultElement.textContent = 'Signing in...';
            
            try {
                const response = await fetch(`${supabaseUrl}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': supabaseAnonKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    accessToken = data.access_token;
                    resultElement.textContent = 'Signed in successfully!';
                    document.getElementById('testButton').disabled = false;
                } else {
                    resultElement.textContent = `Sign in failed: ${data.error_description || data.error || 'Unknown error'}\n\nFull response: ${JSON.stringify(data, null, 2)}`;
                    console.error('Sign in response:', data);
                }
            } catch (error) {
                resultElement.textContent = `Error: ${error.message}`;
            }
        });

        // Test Button
        document.getElementById('testButton').addEventListener('click', async () => {
            const resultElement = document.getElementById('result');
            resultElement.textContent = 'Testing...';

            if (!accessToken) {
                resultElement.textContent = 'Please sign in first';
                return;
            }

            try {
                // Test direct REST API call with Accept header and access token
                const response = await fetch(`${supabaseUrl}/rest/v1/mii_characters?limit=1`, {
                    headers: {
                        'apikey': supabaseAnonKey,
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                
                const status = response.status;
                const text = await response.text();
                
                resultElement.textContent = `REST API response: Status ${status}\n\nBody: ${text}`;
                
                // Log response headers
                const headers = {};
                response.headers.forEach((value, name) => {
                    headers[name] = value;
                });
                
                resultElement.textContent += `\n\nResponse Headers: ${JSON.stringify(headers, null, 2)}`;
            } catch (error) {
                resultElement.textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
