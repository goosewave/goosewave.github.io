<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Poirier's Website</title>
    
    <!-- Inline critical loading screen styles -->
    <style>
        body { margin: 0; overflow: hidden; }
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #87CEEB;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loader {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            animation: spin 1s infinite linear;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-screen h2 {
            font-family: sans-serif;
            color: white;
            margin: 0;
        }
    </style>
    
    <!-- Standard favicon -->
    <link rel="icon" type="image/png" href="assets/icons/lplogo.png">
    
    <!-- Google Fonts - Load asynchronously -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <!-- Rest of your CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Loading screen (shown immediately) -->
    <div class="loading-screen" id="loading-screen">
        <div class="loader"></div>
        <h2>Loading...</h2>
    </div>
    
    <!-- Main content container -->
    <div id="root"></div>
    
    <!-- Audio elements for sounds -->
    <audio id="click-sound" class="sound" preload="auto">
        <source src="assets/sounds/wii-click.mp3" type="audio/mp3">
    </audio>
    
    <!-- Main script with defer attribute -->
    <script src="bundle.js" defer></script>
    
    <!-- Improved loading screen handling -->
    <script>
        // More comprehensive loading check
        window.addEventListener('load', function() {
            // Add a small delay to ensure three.js and other components are initialized
            setTimeout(function() {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(function() {
                    document.getElementById('loading-screen').style.display = 'none';
                }, 500);
            }, 1500); // Slightly longer delay
        });

        // Fallback in case the load event doesn't fire properly
        setTimeout(function() {
            if (document.getElementById('loading-screen').style.opacity !== '0') {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(function() {
                    document.getElementById('loading-screen').style.display = 'none';
                }, 500);
            }
        }, 5000); // Safety timeout
    </script>
</body>
</html>
